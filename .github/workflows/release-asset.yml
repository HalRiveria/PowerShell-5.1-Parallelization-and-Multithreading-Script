name: Release asset

# Attaches ParallelKit.ps1 to a release when it is published, so users can
# download the one file they need. Re-run by hand for an existing tag if needed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the file to (e.g. v1.0)
        required: true

permissions:
  contents: write

jobs:
  attach:
    name: Attach ParallelKit.ps1
    # Windows, so the attached file has Windows (CRLF) line endings.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Upload
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload $env:TAG ParallelKit.ps1 --clobber
          exit $LASTEXITCODE
